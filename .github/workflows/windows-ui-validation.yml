name: Windows UI validation

on:
  push:
    branches: [fix/rename-redesign-0.1.28]
    paths:
      - checkpoint/**
      - tests/**
      - scripts/**
      - pyproject.toml
      - requirements-tested.txt
      - .github/workflows/windows-ui-validation.yml
  pull_request:
    branches: [main, codex/steam-library-import]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-tested.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependências Windows indisponíveis.' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Projeto não instalado.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependências inconsistentes.' }
      - name: Test on Windows
        shell: pwsh
        run: |
          $env:CHECKPOINT_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'checkpoint-ui-tests'
          python -X faulthandler -m pytest tests -q -p no:cacheprovider --junitxml=.ci-results/pytest.xml
          if ($LASTEXITCODE -ne 0) { throw 'Testes Windows falharam.' }
      - name: Build desktop with bundled brand assets
        shell: pwsh
        run: ./scripts/build.ps1 -Python (Get-Command python).Source
      - name: Validate source and extracted executable
        shell: pwsh
        run: |
          python scripts/package_windows_release.py --test-report .ci-results/pytest.xml
          if ($LASTEXITCODE -ne 0) { throw 'Smokes Windows falharam.' }
      - name: Render Windows captures with isolated fixtures
        shell: pwsh
        run: |
          python scripts/render_ui_review.py work/ui-review
          if ($LASTEXITCODE -ne 0) { throw 'Capturas Windows falharam.' }
          python scripts/package_ui_review.py work/ui-review release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Empacotamento visual falhou.' }
      - name: Preserve review artifacts without publishing a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-windows-ui-review
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-windows-ui-tests
          path: .ci-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
