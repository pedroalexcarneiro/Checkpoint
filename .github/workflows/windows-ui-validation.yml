name: Windows UI validation
run-name: Checkpoint 0.1.38 sem admin — somente ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-user:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-tested.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependências indisponíveis.' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Instalação falhou.' }
      - name: Test variant and default bootstrap
        shell: pwsh
        run: |
          $env:CHECKPOINT_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'checkpoint-user-tests'
          python -m pytest tests/test_no_elevation_variant.py tests/test_elevation_0137.py tests/test_native_startup_0138.py -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw 'Regressão no bootstrap.' }
      - name: Build without elevation
        shell: pwsh
        run: ./scripts/build.ps1 -Python (Get-Command python).Source -NoElevation
      - name: Check asInvoker and package extracted app
        shell: pwsh
        run: |
          python scripts/package_user_variant.py
          if ($LASTEXITCODE -ne 0) { throw 'Pacote inválido.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-0138-sem-admin
          path: user-variant-assets/*
          if-no-files-found: error
          retention-days: 14
