name: Windows release

on:
  push:
    branches:
      - main
      - codex/steam-library-import
      - codex/design-fidelity-pt-br
      - fix/0.1.33-drive
    paths:
      - .github/workflows/windows-release.yml
      - .github/release-notes.md
      - scripts/build.ps1
      - scripts/package_windows_release.py
      - requirements-tested.txt
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; from pathlib import Path; from checkpoint import __version__; assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao ler a versão.' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão inválida.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install tested Windows dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-tested.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependências.' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar o projeto.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependências inconsistentes.' }
      - name: Test on Windows
        shell: pwsh
        run: |
          $env:CHECKPOINT_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'checkpoint-tests'
          python -X faulthandler -m pytest tests -q -p no:cacheprovider --junitxml=.ci-results/pytest.xml
          if ($LASTEXITCODE -ne 0) { throw 'Testes Windows falharam.' }
      - name: Build desktop and updater
        shell: pwsh
        run: ./scripts/build.ps1 -Python (Get-Command python).Source
      - name: Package and validate extracted executable
        shell: pwsh
        run: |
          python scripts/package_windows_release.py --test-report .ci-results/pytest.xml
          if ($LASTEXITCODE -ne 0) { throw 'Validação do pacote Windows falhou.' }
      - name: Render Windows interface review
        shell: pwsh
        run: |
          python scripts/render_ui_review.py work/ui-review
          if ($LASTEXITCODE -ne 0) { throw 'Capturas da interface falharam.' }
          python scripts/package_ui_review.py work/ui-review release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Revisão visual incompleta.' }
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint-windows-test-report
          path: .ci-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checkpoint-windows-release
          path: release-assets
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type + ":" + .object.sha' 2>/dev/null); then
            if [[ "$existing" != "commit:$SOURCE_SHA" ]]; then
              echo 'A tag já existe em outro commit; não será alterada.' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --prerelease \
            --title "Checkpoint ${RELEASE_TAG#v} · Interface e PT-BR" \
            --notes-file .github/release-notes.md
