[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpoint-desktop"
version = "0.1.27"
description = "Biblioteca pessoal de jogos offline para Windows"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3", "keyring>=25,<26", "google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2", "requests>=2.32,<3"]

[project.scripts]
checkpoint = "checkpoint.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["checkpoint*"]

[tool.setuptools.package-data]
checkpoint = ["assets/services/*"]
